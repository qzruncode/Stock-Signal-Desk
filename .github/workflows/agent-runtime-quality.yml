name: Agent runtime quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/agent/**'
      - 'src/storage/**'
      - 'src/tools/**'
      - 'src/config/**'
      - 'src/llm/**'
      - 'src/services/**'
      - 'data_provider/**'
      - 'market_data_service/**'
      - 'api/**'
      - 'apps/dsa-web/**'
      - 'tests/test_agent_*'
      - 'tests/test_langgraph*'
      - 'tests/market_data/**'
      - 'tests/test_storage.py'
      - 'tests/test_agent_resume.py'
      - 'tests/fixtures/agent_regression.json'
      - 'requirements*'
      - 'scripts/evaluate_agent.py'
      - 'scripts/check_agent_architecture.py'
      - '.github/workflows/agent-runtime-quality.yml'

permissions:
  contents: read

jobs:
  scoped-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LANGSMITH_TRACING: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'requirements*.lock'
      - name: Install hashed Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-eval.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check Agent architecture
        run: python scripts/check_agent_architecture.py
      - name: Offline Agent and runtime contracts
        run: >-
          python -m pytest -q
          tests/test_agent_reported_usage.py tests/test_agent_conversation_memory.py
          tests/test_agent_regression.py tests/test_agent_answer_contract.py
          tests/test_agent_reflection.py tests/test_agent_conversations.py
          tests/test_agent_durable_runtime.py tests/test_agent_durable_runtime_part1.py
          tests/test_agent_durable_runtime_part2.py tests/test_run_registry.py
          tests/test_langgraph_native_stream.py
          tests/test_langgraph_agent_runtime.py tests/test_langgraph_approval.py
          tests/test_agent_quality.py
          tests/test_agent_architecture.py tests/test_agent_planning.py
          tests/test_langgraph_multi_agent_team.py tests/test_agent_goal.py
          tests/test_agent_goal_projection.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci
        working-directory: apps/dsa-web
      - name: Scoped browser-component contracts
        working-directory: apps/dsa-web
        run: >-
          npx vitest run src/pages/AgentMonitoringPage.test.tsx src/App.test.tsx
          src/components/layout/__tests__/Shell.test.tsx
          src/components/runExplorer/RunDetailContent.test.tsx
          src/components/assistant-ui/ChatRuntimeBridge.test.tsx
          src/components/assistant-ui/StructuredAnswerReferences.test.tsx
          src/api/__tests__/agent.test.ts src/utils/chatMessageDeletion.test.ts
          src/api/__tests__/agentMonitoring.test.ts
          src/utils/__tests__/assistantStreamContract.test.ts
          src/hooks/__tests__/useChatController.test.tsx
          src/components/assistant-ui/threadlist-sidebar.test.tsx
      - name: Scoped frontend type contracts
        working-directory: apps/dsa-web
        run: >-
          node scripts/typecheck-files.mjs
          src/hooks/useChatController.ts src/hooks/useConversationActions.ts
          src/pages/ChatHomePage.tsx src/pages/AgentMonitoringPage.tsx src/utils/agentMonitoring.ts
          src/pages/SettingPage.tsx src/pages/MarketWorkspacePage.tsx src/pages/RunExplorerPage.tsx
          src/components/layout/WorkspaceQueryProvider.tsx src/components/layout/WorkspaceNav.tsx
          src/components/layout/Shell.tsx src/api/agent.ts src/App.tsx
      - name: Scoped frontend lint and size budget
        working-directory: apps/dsa-web
        run: |
          npx eslint src/hooks/useChatController.ts src/hooks/useConversationActions.ts src/pages/ChatHomePage.tsx src/pages/AgentMonitoringPage.tsx src/pages/SettingPage.tsx src/pages/MarketWorkspacePage.tsx src/pages/RunExplorerPage.tsx src/components/layout/WorkspaceQueryProvider.tsx src/components/layout/WorkspaceNav.tsx src/components/layout/Shell.tsx src/components/assistant-ui/StructuredAnswerReferences.tsx src/components/assistant-ui/StructuredAnswerReferencesUtils.ts src/api/agent.ts src/App.tsx
          node scripts/check-code-constraints.mjs --files src/hooks/useChatController.ts src/hooks/useConversationActions.ts src/pages/ChatHomePage.tsx src/pages/AgentMonitoringPage.tsx src/components/layout/WorkspaceNav.tsx src/components/layout/Shell.tsx src/components/assistant-ui/StructuredAnswerReferences.tsx src/App.tsx

  market-data-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: market_data_service/requirements.lock
      - name: Install isolated data-service dependencies
        run: |
          python -m pip install --require-hashes -r market_data_service/requirements.lock
          python -m pip install pytest==9.1.0
          python -m pip check
      - name: Offline data-service contracts
        run: python -m pytest -q tests/market_data/test_service.py
