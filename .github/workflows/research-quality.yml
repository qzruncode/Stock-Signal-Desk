name: Research workspace quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/agent/**'
      - 'src/storage/**'
      - 'src/tools/registry.py'
      - 'src/services/research*'
      - 'src/services/batch_scheduler.py'
      - 'api/**'
      - 'apps/dsa-web/**'
      - 'tests/test_*research*'
      - 'tests/test_agent_*'
      - 'tests/test_langgraph*'
      - 'tests/test_batch_scheduler.py'
      - 'tests/fixtures/agent_regression.json'
      - 'requirements*'
      - 'scripts/evaluate_agent.py'
      - '.github/workflows/research-quality.yml'

permissions:
  contents: read

jobs:
  scoped-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'requirements*.lock'
      - name: Install hashed Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-eval.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Offline Agent and research contracts
        run: >-
          python -m pytest -q
          tests/test_agent_reported_usage.py tests/test_agent_conversation_memory.py
          tests/test_agent_regression.py tests/test_research_workspace.py
          tests/test_research_api.py tests/test_research_migration.py
          tests/test_langgraph_native_stream.py tests/test_langgraph_agent_runtime.py
          tests/test_langgraph_approval.py tests/test_batch_scheduler.py tests/test_agent_quality.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci
        working-directory: apps/dsa-web
      - name: Scoped browser-component contracts
        working-directory: apps/dsa-web
        run: >-
          npx vitest run src/pages/ResearchPage.test.tsx src/pages/AgentMonitoringPage.test.tsx
          src/App.test.tsx src/components/layout/__tests__/Shell.test.tsx
          src/components/assistant-ui/ChatRuntimeBridge.test.tsx
          src/api/__tests__/agent.test.ts src/utils/chatMessageDeletion.test.ts
          src/api/__tests__/agentMonitoring.test.ts
          src/hooks/__tests__/useChatController.test.tsx
          src/components/assistant-ui/threadlist-sidebar.test.tsx
      - name: Scoped frontend type contracts
        working-directory: apps/dsa-web
        run: >-
          node scripts/typecheck-files.mjs
          src/hooks/useChatController.ts src/hooks/useConversationActions.ts
          src/pages/ChatHomePage.tsx src/pages/AgentMonitoringPage.tsx src/utils/agentMonitoring.ts
          src/pages/ResearchPage.tsx src/pages/SettingPage.tsx src/pages/MarketWorkspacePage.tsx
          src/pages/RunExplorerPage.tsx src/components/research/ResearchAlerts.tsx
          src/components/layout/WorkspaceQueryProvider.tsx src/components/layout/WorkspaceNav.tsx
          src/components/layout/Shell.tsx src/api/research.ts src/App.tsx
      - name: Scoped frontend lint and size budget
        working-directory: apps/dsa-web
        run: |
          npx eslint src/pages/ResearchPage.tsx src/components/research/ResearchAlerts.tsx src/hooks/useChatController.ts src/hooks/useConversationActions.ts
          node scripts/check-code-constraints.mjs --files src/pages/ResearchPage.tsx src/components/research/ResearchAlerts.tsx src/hooks/useChatController.ts src/hooks/useConversationActions.ts src/pages/ChatHomePage.tsx src/pages/AgentMonitoringPage.tsx
