[unix_http_server]
file=%(here)s/../.market-data/run/supervisor.sock
chmod=0700

[supervisord]
logfile=%(here)s/../.market-data/logs/supervisor.log
pidfile=%(here)s/../.market-data/run/supervisord.pid
childlogdir=%(here)s/../.market-data/logs
logfile_maxbytes=5MB
logfile_backups=2

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../.market-data/run/supervisor.sock

[program:data-api]
directory=%(here)s/..
command=%(here)s/../.venv-data/bin/uvicorn market_data_service.api:app --host 127.0.0.1 --port 8010
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=40
stdout_logfile=%(here)s/../.market-data/logs/api.log
redirect_stderr=true

[program:data-events]
directory=%(here)s/..
command=%(here)s/../.venv-data/bin/python -m market_data_service.event_relay
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=40
stdout_logfile=%(here)s/../.market-data/logs/events.log
redirect_stderr=true

[program:data-worker]
directory=%(here)s/..
command=%(here)s/../.venv-data/bin/celery -A market_data_service.worker:celery_app worker -n sources@%%h -Q market-data --concurrency=4 --loglevel=INFO
autostart=true
autorestart=true
stopsignal=QUIT
stopasgroup=false
killasgroup=true
stopwaitsecs=40
stdout_logfile=%(here)s/../.market-data/logs/worker.log
redirect_stderr=true

[program:data-sync]
directory=%(here)s/..
command=%(here)s/../.venv-data/bin/celery -A market_data_service.worker:celery_app worker -n sync@%%h -Q market-data-sync --concurrency=2 --loglevel=INFO
autostart=true
autorestart=true
stopsignal=QUIT
stopasgroup=false
killasgroup=true
stopwaitsecs=40
stdout_logfile=%(here)s/../.market-data/logs/sync.log
redirect_stderr=true

[program:data-scheduler]
directory=%(here)s/..
command=%(here)s/../.venv-data/bin/celery -A market_data_service.worker:celery_app beat --schedule .market-data/run/celerybeat --loglevel=INFO
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=%(here)s/../.market-data/logs/scheduler.log
redirect_stderr=true
